<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcolo BMI</title>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 720px;
            margin: 0;
            background: #F1F3F5;
}
        .body{
            width: 480px;
            height: 640px;
            box-sizing: border-box;
            background: #F1F3F5;
            color: #1F2328;
            font-family: 'IBM Plex Sans', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding: 40px;
        }
        
        .title{
            margin: 0;
            font-size: 28px;
            font-weight: 700;
        }

        form{
            width: 360px;
            box-sizing: border-box;
            background: #FFFFFF;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        div{
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        label{
            font-size: 14px;
            font-weight: 600;
        }
        input{
            height: 44px;
            box-sizing: border-box;
            padding: 0 12px;
            font-size: 16px;
            font-family: inherit;
            border: 1px solid #C9CED4;
            border-radius: 8px;
        }
        button{
            margin-top: 8px;
            height: 44px;
            border: none;
            border-radius: 8px;
            background: #1F2328;
            color: #FFFFFF;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
        }

    </style>
</head>
<body>
    <div class="body">
        <h1 class="title">Calcolatore BMI</h1>
        <form>
            <div>
                <label for="nome">Nome</label>
                <input id="nome" type="text" placeholder="Luca">
            </div>
            <div>
                <label for="peso">Peso (kg)</label>
                <input id="peso" type="number" placeholder="70">
            </div>
            <div>
                <label for="altezza">altezza (cm)</label>
                <input id="altezza" type="number" placeholder="178">
            </div>
            <button type="button">Calcola</button>
        </form>
    </div>
</body>
</html>
